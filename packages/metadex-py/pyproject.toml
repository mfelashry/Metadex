[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metadex"
version = "0.2.0"
description = "Scan a photo or a folder for hidden data from the terminal."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Metadex" }]
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
  "pillow>=10,<13",
  "python-multipart>=0.0.9",
  "piexif>=1.1,<2",
]

[project.scripts]
metadex = "metadex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
